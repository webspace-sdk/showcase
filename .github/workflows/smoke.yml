name: Worlds smoke test

# Every night (and on demand), make sure every published world still comes up.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm init -y >/dev/null && npm install playwright@1 && npx playwright install --with-deps chromium
      - run: node .github/smoke/smoke.mjs
